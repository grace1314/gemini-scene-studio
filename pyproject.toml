[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-scene-studio"
version = "0.1.0"
description = "Local stereo-to-pointcloud, TSDF and depth-constrained Gaussian reconstruction workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python==4.11.0.86", "scipy>=1.11,<2", "open3d==0.19.0"]

[project.optional-dependencies]
gpu = ["gsplat==1.5.3", "ninja>=1.11", "kornia>=0.7,<0.9"]

[tool.setuptools]
packages = ["studio"]
